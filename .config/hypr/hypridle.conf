general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display
}

# Screen dim after 5 minutes (300 seconds)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum
    on-resume = brightnessctl -r                 # restore monitor backlight
}

# Screen lock after 10 minutes (600 seconds)
listener {
    timeout = 600
    on-timeout = loginctl lock-session           # lock screen
}

# Turn off screen after 15 minutes (900 seconds)
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off       # screen off
    on-resume = hyprctl dispatch dpms on         # screen on
}

# Suspend after 30 minutes (1800 seconds)
listener {
    timeout = 1800
    on-timeout = systemctl suspend               # suspend pc
}

listener {
    timeout = 3600
    on-timeout = ~/.config/hypr/scripts/scriptedShutdown.sh
}
